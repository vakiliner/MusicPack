plugins {
	id 'java'
}

repositories {
	maven {
		name = 'MinecraftLibs'
		url = 'https://libraries.minecraft.net'
	}

	mavenCentral()
}

dependencies {
	compileOnly group: 'com.google.code.gson', name: 'gson', version: project.gson_version
	compileOnly group: 'org.apache.logging.log4j', name: 'log4j-api', version: project.log4j_version
}

processResources {
	inputs.property 'pack_format', project.pack_format

	filesMatching('pack.mcmeta') {
		expand inputs.properties
	}
}

processTestResources {
	inputs.property 'pack_format', project.pack_format

	filesMatching('pack.mcmeta') {
		expand inputs.properties
	}
}
